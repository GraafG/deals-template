# Grouping policy (shared across all provider deal-tracker repos):
# - Patch + minor updates are batched into ONE pull request per ecosystem, so the
#   backlog stays at roughly one reviewable PR per ecosystem per week.
# - Major updates are deliberately left OUT of every group so they stay visible
#   as individual pull requests that get a real review.
# - Pre-1.0 (0.x) packages are ALSO excluded from the batch group. Under semver a
#   0.x "minor" is allowed to contain breaking changes, so Dependabot labels it a
#   minor and would otherwise sweep a breaking change into the auto-batched PR.
#   Keep the exclude-patterns list below in sync with the 0.x direct dependencies
#   in package.json; drop a package from the list once it reaches 1.0.
#   Current 0.x direct dependencies: sharp.
# - Security updates are grouped separately so they are never queued behind a
#   routine version bump. Note that 0.x packages are intentionally NOT excluded
#   from the security group: a security fix should always travel the fast path.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "sharp"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: chore(ci)
      include: scope
